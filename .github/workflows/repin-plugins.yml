name: Repin Claude Code Plugins
on:
  workflow_dispatch:
    inputs:
      name:
        description: Name of the plugin to repin
        required: false
        type: string
      marketplace:
        description: The marketplace to repin the plugin to
        required: false
        type: choice
        default: claude-code
        options:
          - claude-code
          - copilot
      sha:
        description: Commit SHA to repin to
        required: false
        type: string
      path:
        description: The path to the plugin root in the repository
        required: false
        type: string
      json:
        description: JSON string of the plugin's marketplace.json file
        required: false
        type: string
  repository_dispatch:
    types: [plugin-release]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: repin-plugins
  cancel-in-progress: false
jobs:
  repin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: spencerbeggs/ai-plugin-marketplace-manager@v2
        with:
          app-client-id: ${{ secrets.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          name: ${{ inputs.name }}
          marketplace: ${{ inputs.marketplace }}
          sha: ${{ inputs.sha }}
          path: ${{ inputs.path }}
          json: ${{ github.event_name == 'workflow_dispatch' && inputs.json || github.event.client_payload.json }}
          # main's "workflow" ruleset restricts PRs to allowed_merge_methods: [squash] —
          # rebase/merge are rejected by the auto-merge GraphQL call at runtime.
          # auto-merge: "squash"
          mode: "commit"
