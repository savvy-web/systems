name: Hook Tests

# BATS + shellcheck coverage for the Claude Code plugins' hook scripts (silk
# and github-actions). The suites are pure shell (bash + bats + shellcheck +
# jq + git) and need no Node.js / pnpm install, so they run as a small
# dedicated job rather than through the release reusable workflow.
#
# github-actions paths include agents/ and skills/ because its bats suites
# assert the agent/skill registration contract (every skill on disk is named
# in the orientation payload and preloaded by the agent).

on:
  pull_request:
    branches: [main]
    paths:
      - plugins/silk/hooks/**
      - plugins/silk/tests/**
      - plugins/silk/bin/**
      - plugins/github-actions/**
      - .github/workflows/hook-tests.yml
  push:
    branches: [main]
    paths:
      - plugins/silk/hooks/**
      - plugins/silk/tests/**
      - plugins/silk/bin/**
      - plugins/github-actions/**
      - .github/workflows/hook-tests.yml

concurrency:
  group: hook-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hook-tests:
    name: BATS + shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install bats, shellcheck, and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck jq

      - name: Run silk hook tests
        run: bash plugins/silk/tests/run-hook-tests.sh

      - name: Run github-actions hook tests
        run: bash plugins/github-actions/tests/run-hook-tests.sh
