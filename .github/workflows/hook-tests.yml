name: Hook Tests

# BATS + shellcheck coverage for the silk plugin (pluginfinity source at
# plugin/), run against both built hosts (Claude Code and Copilot). The suite
# is shell-first (bash + bats + shellcheck + jq + git) and also requires
# Node.js 24.11.0+ and an installed workspace: it runs `pluginfinity build`
# and `build --check` from plugin/node_modules, and monitor tests execute
# Node-based scripts.

on:
  pull_request:
    branches: [main]
    paths:
      - plugin/**
      - .github/workflows/hook-tests.yml
  push:
    branches: [main]
    paths:
      - plugin/**
      - .github/workflows/hook-tests.yml

concurrency:
  group: hook-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hook-tests:
    name: BATS + shellcheck
    # Temporarily disabled: the suite needs runner setup work (tracked by the
    # repo owner) before it can pass on hosted runners. Run it locally via
    # `pnpm test:hooks` in the meantime; re-enable by removing this `if`.
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0

      - name: Install bats, shellcheck, jq, and git
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck jq git

      # Re-enabling also needs pnpm setup and `pnpm install` before this step.
      - name: Run silk plugin tests
        run: bash plugin/__test__/run-tests.sh
