allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  core-js: true
  esbuild: true
  msgpackr-extract: true
allowedDeprecatedVersions:
  "@types/acorn": "*"
  git-raw-commits: "*"
  glob: "*"
  inflight: "*"
  node-domexception: "*"
  prebuild-install: "*"
autoInstallPeers: true
blockExoticSubdeps: true
catalogs:
  build:
    "@types/bun": ^1.4.4
  build:peers:
    "@types/bun": ^1.4.4
  docs:
    "@rspress/core": ^2.0.23
    "@rspress/plugin-sitemap": ^2.0.23
    rspress-plugin-mermaid: ^1.0.3
    vite: ^8.3.5
    vitepress: ^2.0.0-alpha.21
  docs:peers:
    "@rspress/core": ^2.0.0
    "@rspress/plugin-sitemap": ^2.0.23
    rspress-plugin-mermaid: ^1.0.3
    vite: ^8.3.0
    vitepress: ^2.0.0-alpha.21
  lint:
    "@biomejs/biome": 2.6.6
    "@changesets/cli": ^3.0.3
    "@commitlint/cli": ^21.2.4
    "@commitlint/config-conventional": ^21.2.4
    husky: ^9.1.7
    lint-staged: ^17.6.0
    markdownlint-cli2: ^0.24.0
    markdownlint-cli2-formatter-codequality: ^0.0.8
    turbo: ^2.11.10
  lint:peers:
    "@biomejs/biome": 2.6.6
    "@changesets/cli": ^3.0.3
    "@commitlint/cli": ^21.2.4
    "@commitlint/config-conventional": ^21.2.4
    husky: ^9.1.7
    lint-staged: ^17.6.0
    markdownlint-cli2: ^0.24.0
    markdownlint-cli2-formatter-codequality: ^0.0.8
    turbo: ^2.11.10
  silk:
    "@types/bun": ^1.4.4
    ink: ^8.0.0
  silk:peers:
    "@types/bun": ^1.4.4
    ink: ^8.0.0
  test:
    "@vitest/coverage-istanbul": ^5.0.5
    "@vitest/coverage-v8": ^5.0.5
    "@vitest/expect": ^5.0.5
    "@yarnpkg/cli-dist": ^4.18.1
    vite: ^8.3.5
    vitest: ^5.0.5
  test:peers:
    "@vitest/coverage-istanbul": ^5.0.0
    "@vitest/coverage-v8": ^5.0.0
    "@vitest/expect": ^5.0.0
    "@yarnpkg/cli-dist": ^4.18.0
    vite: ^8.3.0
    vitest: ^5.0.0
configDependencies:
  "@effected/pnpm-plugin-effected": 0.26.1
includeWorkspaceRoot: true
linkWorkspacePackages: deep
loglevel: info
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@okfit/*"
  - "@oxc-parser/*"
  - "@pluginfinity/*"
  - "@pnpm/*"
  - "@savvy-web/*"
  - "@tsdoctor/*"
  - "@vitest-agent/*"
  - "@vitest/*"
  - "@yarnpkg/*"
  - oxc-parser
  - pluginfinity
  - pnpm
  - reposets
  - rolldown-pnpm-config
  - rspress-plugin-api-extractor
  - runtime-resolver
  - std-osc8
  - vitepress-plugin-api-extractor
  - vitest
  - vitest-bats
  - yarn
  - "@effected/pnpm-plugin-effected"
nodeOptions: --import=tsx
overrides:
  "@okfit/cli>@effected/walker": 0.28.0
  "@okfit/core>@effected/walker": 0.28.0
  "@okfit/engine>@effected/walker": 0.28.0
  "@okfit/lsp>@effected/walker": 0.28.0
  "@okfit/mcp>@effected/walker": 0.28.0
  "@okfit/profiles>@effected/walker": 0.28.0
  "@pluginfinity/cli>@effected/walker": 0.28.0
  "@pluginfinity/engine>@effected/walker": 0.28.0
  "@vitest-agent/cli>@effected/walker": 0.28.0
  "@vitest-agent/cli>@effected/workspaces": 0.46.0
  "@vitest-agent/engine>@effected/memfs": 0.26.0
  "@vitest-agent/engine>@effected/walker": 0.28.0
  "@vitest-agent/engine>@effected/workspaces": 0.46.0
  "@vitest-agent/mcp>@effected/walker": 0.28.0
  "@vitest-agent/plugin>@effected/walker": 0.28.0
  "@vitest-agent/plugin>@effected/workspaces": 0.46.0
  "@vitest-agent/reporter>@effected/walker": 0.28.0
  "@vitest-agent/ui>@effected/walker": 0.28.0
  pluginfinity>@effected/walker: 0.28.0
  rolldown-pnpm-config>@effected/npm: 0.34.0
  rolldown-pnpm-config>@effected/walker: 0.28.0
  rolldown-pnpm-config>@effected/workspaces: 0.46.0
packages:
  - e2e/*
  - packages/*
  - plugin
peerDependencyRules:
  allowedVersions:
    "@commitlint/load>typescript": ^5.5.0 || ^6.0.0 || ^7.0.0 || ^7.1.0-beta
    "@shikijs/twoslash>typescript": ^5.5.0 || ^6.0.0 || ^7.0.0 || ^7.1.0-beta
    "@typescript/vfs>typescript": ^5.5.0 || ^6.0.0 || ^7.0.0 || ^7.1.0-beta
    cosmiconfig>typescript: ^5.5.0 || ^6.0.0 || ^7.0.0 || ^7.1.0-beta
    tsdown>typescript: ^5.5.0 || ^6.0.0 || ^7.0.0 || ^7.1.0-beta
    twoslash-vue>typescript: ^5.5.0 || ^6.0.0 || ^7.0.0 || ^7.1.0-beta
    twoslash>typescript: ^5.5.0 || ^6.0.0 || ^7.0.0 || ^7.1.0-beta
    vue>typescript: ^5.5.0 || ^6.0.0 || ^7.0.0 || ^7.1.0-beta
  ignoreMissing:
    - "@changesets/cli"
    - "@commitlint/cli"
    - "@commitlint/config-conventional"
    - "@types/bun"
    - "@types/node"
    - "@vitest/coverage-istanbul"
    - "@vitest/coverage-v8"
    - "@vitest/expect"
    - husky
    - lint-staged
    - markdownlint-cli2
    - markdownlint-cli2-formatter-codequality
    - tsx
    - turbo
    - typescript
    - vite
    - vitest
publicHoistPattern:
  - "@changesets/cli"
  - "@commitlint/cli"
  - "@commitlint/config-conventional"
  - "@commitlint/cz-commitlint"
  - "@types/bun"
  - "@vitest/coverage-istanbul"
  - "@vitest/coverage-v8"
  - husky
  - lint-staged
  - markdownlint-cli2
  - markdownlint-cli2-formatter-codequality
  - turbo
  - vitest
resolvePeersFromWorkspaceRoot: false
strictDepBuilds: true
