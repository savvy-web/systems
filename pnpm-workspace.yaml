packages:
  - packages/*
autoInstallPeers: true
configDependencies:
  "@savvy-web/pnpm-plugin-silk": 0.15.1+sha512-/YweRPSahFlUxa5P5sCspJ9VMyaICvZDEutIP3rPrjNEW7kJGg93lGXzJI2WMwvaTBRzOrjFGVRbTGkx6ZX30g==
includeWorkspaceRoot: true
linkWorkspacePackages: deep
loglevel: info
minimumReleaseAgeExclude:
  - tsdown@0.22.2
  - workspaces-effect@1.2.0
  - json-schema-effect@0.2.2
  - "@microsoft/api-extractor@7.58.9"
  - "@rushstack/ts-command-line@5.3.10"
publicHoistPattern:
  - "@vitest/coverage-v8"
  - vitest
  - vitest-agent-reporter
verifyDepsBeforeRun: false
