[package.build.meta]
localPaths = ["../../website/lib/models/silk-core"]

[package.build.meta.tsdoc]
# A list replaces the default _base rule, so it is restated here.
suppressWarnings = [
	{ messageId = "ae-forgotten-export", pattern = "_base" },
	{ messageId = "ae-missing-release-tag", pattern = "_d_exports" },
]
tagDefinitions = [{ tagName = "@since", syntaxKind = "block" }]
